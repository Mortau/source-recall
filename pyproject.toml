[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "source-recall"
version = "0.1.0"
description = "Self-hosted repository indexing and hybrid code retrieval"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SourceRecall contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "fastapi==0.141.1",
  "fastmcp==3.4.7",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
  "qdrant-client==1.19.0",
  "uvicorn[standard]==0.52.1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
source-recall-api = "source_recall.server:main"
source-recall-index = "source_recall.cli:main"
source-recall-mcp = "source_recall.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
